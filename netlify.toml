[build]
command = "cd nextjs-openai-insights && npm install && npm run build"
publish = "nextjs-openai-insights/.next"

[build.environment]
NODE_VERSION = "22.16.0"

[[plugins]]
package = "@netlify/plugin-nextjs"

[functions]
node_bundler = "esbuild"
directory = "nextjs-openai-insights/netlify/functions"

# Background Functions são detectadas automaticamente pelo sufixo "-background"
# A função process-job-background.js será automaticamente configurada como background
# Não é necessário configurar aqui - o Netlify detecta pelo nome do arquivo
