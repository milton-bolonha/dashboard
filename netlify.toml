[build]
command = "cd dashboard && npm run build"
publish = "dashboard/.next"

[build.environment]
NODE_VERSION = "22.16.0"

[[plugins]]
package = "@netlify/plugin-nextjs"

[functions]
node_bundler = "esbuild"
directory = "netlify/functions"

# Background function para geração de tiles (ES Module)
[functions."netlify/functions/generate-tiles.mjs"]
included_files = ["dashboard/lib/**"]
